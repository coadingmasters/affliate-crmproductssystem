; Voice notes can run to 100 MB, so PHP has to accept a request that large.
; Hostinger (and any PHP-FPM/CGI host) reads this file from the document root.
; If your host ignores it, set the same values in hPanel > PHP Configuration.
upload_max_filesize = 100M
post_max_size = 105M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
